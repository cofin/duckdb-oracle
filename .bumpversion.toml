# bump-my-version configuration for the EXTENSION version.
# Mirrors the litestar-ecosystem convention (uv run bump-my-version), adapted
# for this C++ project which has no pyproject.toml.
#
#   make bump-version bump=patch
#   make bump-version bump=minor
#   make bump-prerelease version=0.3.0-alpha.1
#
# description.yml is the single source of truth for the extension version;
# auto-tag.yml reads it to create the v{version} release tag.
[tool.bumpversion]
allow_dirty = true
commit = false
commit_args = "--no-verify"
current_version = "0.2.2"
ignore_missing_files = false
ignore_missing_version = false
message = "chore(release): bump to v{new_version}"
parse = """(?x)
    (?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)
    (-(?P<pre>alpha|beta|rc)\\.(?P<pre_n>\\d+))?
"""
regex = false
replace = "{new_version}"
search = "{current_version}"
serialize = ["{major}.{minor}.{patch}", "{major}.{minor}.{patch}-{pre}.{pre_n}"]
sign_tags = false
tag = false
tag_message = "chore(release): v{new_version}"
tag_name = "v{new_version}"

[tool.bumpversion.parts.pre]
first_value = "stable"
optional_value = "stable"
values = ["alpha", "beta", "rc", "stable"]

[tool.bumpversion.parts.pre_n]
first_value = "1"

# description.yml is the canonical location of the extension version.
[[tool.bumpversion.files]]
filename = "description.yml"
search = "version: {current_version}"
replace = "version: {new_version}"

# Keep the runtime metadata assertion aligned with the canonical version.
[[tool.bumpversion.files]]
filename = "test/unit_tests/test_extension_metadata.test"
search = "{current_version}"
replace = "{new_version}"
