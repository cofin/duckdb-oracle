extension:
  name: oracle
  description: High-performance Oracle Database connector using lazy runtime OCI loading with catalog integration, filter/projection pushdown, flashback queries, and vectorized bulk writes
  version: 0.3.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64"
  maintainers:
    - cofin

repo:
  github: cofin/duckdb-oracle
  ref: HEAD
  variegata: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

docs:
  hello_world: |
    -- Install and load the Oracle extension from Community Extensions
    INSTALL oracle FROM community;
    LOAD oracle;

    -- Configure credentials via DuckDB Secrets
    CREATE SECRET my_oracle (
        TYPE oracle,
        HOST 'localhost',
        PORT 1521,
        SERVICE 'FREEPDB1',
        USER 'scott',
        PASSWORD 'tiger'
    );

    -- Attach the Oracle database as a native DuckDB catalog
    ATTACH '' AS ora (TYPE oracle, SECRET my_oracle);

    -- Query Oracle tables with automatic filter and projection pushdown
    SELECT empno, ename, sal
    FROM ora.SCOTT.EMP
    WHERE deptno = 10;
  extended_description: |
    The `oracle` extension connects DuckDB to Oracle Database (19c, 21c, and 23ai) using Oracle Call Interface (OCI) loaded lazily at runtime (`libclntsh.so` / `libclntsh.dylib` / `oci.dll`).

    **Key Features:**
    - **Zero Load-Time Dependency**: `INSTALL oracle FROM community; LOAD oracle;` succeeds without Oracle Instant Client installed; `libclntsh` (19c, 21c, or 23ai) is resolved dynamically when opening a connection.
    - **Catalog Integration (`ATTACH ... TYPE oracle`)**: Browse schemas, tables, views, materialized views, and synonyms as native DuckDB catalog entries.
    - **Pushdown & Optimizer Integration**: Pushes complex predicates, projections, flashback clauses (`AS OF SCN` / `AS OF TIMESTAMP`), and `ALL_TABLES.NUM_ROWS` cardinality estimates to Oracle.
    - **Rich Type Support**: Supports `NUMBER`, `BINARY_FLOAT`, `BINARY_DOUBLE`, `DATE`, `TIMESTAMP`, `TIMESTAMP WITH TIME ZONE`, `INTERVAL`, `CLOB`, `BLOB`, `RAW`, Oracle 21c/23ai `JSON`, Oracle 23ai `VECTOR` (`ARRAY`/`LIST`), and `MDSYS.SDO_GEOMETRY` (`GEOMETRY` WKB + CRS).
    - **Vectorized Array Writes**: High-throughput `INSERT INTO` and `COPY` via `OCIBindArrayOfStruct`.
