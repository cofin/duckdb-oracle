name: DuckDB Update Check

on:
  schedule:
    - cron: '0 6 * * *' # Run daily at 6:00 UTC
  workflow_dispatch:
    inputs:
      check_prerelease:
        description: 'Check for pre-release versions'
        required: false
        type: boolean
        default: false

jobs:
  check-update:
    name: Check for Updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          # Use PAT for checkout to enable pushing workflow file changes
          # GITHUB_TOKEN cannot modify files in .github/workflows/
          token: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure labels exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create duckdb-update --color 1d76db --description "Automated DuckDB version bump" --force
          gh label create automated --color ededed --description "Opened by automation" --force

      - name: Install Dependencies
        run: pip install requests semantic_version uv

      - name: Check for Updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CHECK_PRERELEASE: ${{ inputs.check_prerelease }}
        run: |
          # Create a python script to check versions
          cat <<'PYTHON_SCRIPT' > "$RUNNER_TEMP/check_version.py"
          import os
          import re
          import sys
          import requests
          import semantic_version

          def get_current_version():
              # Read from main-distribution-pipeline.yml
              with open('.github/workflows/main-distribution-pipeline.yml', 'r') as f:
                  content = f.read()
                  match = re.search(r'duckdb_version:\s*v?([0-9.]+)', content)
                  if match:
                      return match.group(1)
              return None

          def get_latest_duckdb_version(include_prerelease=False):
              url = "https://api.github.com/repos/duckdb/duckdb/releases"
              headers = {"Authorization": f"token {os.environ.get('GITHUB_TOKEN')}"}
              response = requests.get(url, headers=headers)
              response.raise_for_status()
              
              releases = response.json()
              latest_ver = None
              
              for release in releases:
                  tag = release['tag_name'].lstrip('v')
                  if not include_prerelease and release['prerelease']:
                      continue
                  
                  try:
                      ver = semantic_version.Version(tag)
                      if latest_ver is None or ver > latest_ver:
                          latest_ver = ver
                  except ValueError:
                      continue
                      
              return latest_ver

          current = get_current_version()
          if not current:
              print("Could not determine current version")
              sys.exit(1)
              
          include_prerelease = os.environ.get('INPUT_CHECK_PRERELEASE', 'false').lower() == 'true'
          latest = get_latest_duckdb_version(include_prerelease)
          
          print(f"Current version: {current}")
          print(f"Latest version: {latest}")
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              print(f"current_version={current}", file=fh)
              if latest is not None and latest > semantic_version.Version(current):
                  print(f"new_version={latest}", file=fh)
          PYTHON_SCRIPT
          
          python "$RUNNER_TEMP/check_version.py"

          NEW_VERSION=$(grep '^new_version=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2 || true)
          if [ -n "$NEW_VERSION" ]; then
            OPEN_PR_COUNT=$(gh pr list --head "feat/duckdb-v${NEW_VERSION}" --state open --json number --jq 'length')
            if [ "${OPEN_PR_COUNT:-0}" -gt 0 ]; then
              echo "An open PR for feat/duckdb-v${NEW_VERSION} already exists. Skipping update."
              echo "update_available=false" >> "$GITHUB_OUTPUT"
            else
              echo "update_available=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "update_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close Stale PRs
        if: steps.check.outputs.update_available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        run: |
          # Find existing PRs with the 'duckdb-update' label, excluding the current target version branch
          STALE_PRS=$(gh pr list --label "duckdb-update" --state open --json number,headRefName | jq -r --arg branch "feat/duckdb-v${NEW_VERSION}" '.[] | select(.headRefName != $branch) | .number')
          
          if [ -n "$STALE_PRS" ]; then
            echo "Found stale PRs. Closing them..."
            echo "$STALE_PRS" | while read -r pr_number; do
              [ -z "$pr_number" ] && continue
              echo "Closing PR #$pr_number"
              gh pr close "$pr_number" --delete-branch --comment "Closing in favor of newer DuckDB version v${NEW_VERSION}."
            done
          fi

      - name: Create Branch and Update
        if: steps.check.outputs.update_available == 'true'
        id: update
        env:
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          # Use PAT for git operations involving workflow files
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}
        run: |
          BRANCH_NAME="feat/duckdb-v${NEW_VERSION}"
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Check if branch already exists
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists. Updating..."
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
            # Reset to main to ensure a clean slate
            git fetch origin main
            git reset --hard origin/main
          else
            echo "Creating new branch $BRANCH_NAME..."
            git fetch origin main
            git checkout -b "$BRANCH_NAME" origin/main
          fi
          
          ./scripts/bump_duckdb_version.sh "v${NEW_VERSION}"

          git add -A
          git commit -m "chore(deps): upgrade DuckDB to v${NEW_VERSION}"
          
          # Force push to overwrite if it existed
          git push origin "$BRANCH_NAME" --force
          
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "branch_created=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.update.outputs.branch_created == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          BRANCH_NAME: ${{ steps.update.outputs.branch_name }}
          # Use PAT for PR creation to ensure workflow file changes are accepted
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}
        run: |
          # Check if PR exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')
          
          if [ -z "$EXISTING_PR" ]; then
            PR_URL=$(gh pr create \
              --title "chore(deps): upgrade DuckDB to v${NEW_VERSION}" \
              --body "This PR updates the DuckDB submodule and CI configuration from v${CURRENT_VERSION} to version v${NEW_VERSION}. \n\n This triggered a compatibility build. Please review the CI results." \
              --base main \
              --head "$BRANCH_NAME" \
              --label "duckdb-update" \
              --label "automated")
            echo "Created PR: $PR_URL"
            EXISTING_PR="$PR_URL"
          else
            echo "PR already exists: $EXISTING_PR"
            # Comment on existing PR to notify of update
            gh pr comment "$EXISTING_PR" --body "Force-updated branch with fresh changes for v${NEW_VERSION}."
          fi
          echo "PR opened for v${NEW_VERSION}. Review CI, then merge manually."
